appId: com.wasley.fabegon.erp
productName: Fabegon ERP
copyright: Copyright © 2026 Wasley Inc.

icon: build/icon.png

# MUST be false: asar:true packs files into app.asar and Chromium's renderer
# cannot load ES-module chunks via file:// from inside the asar archive.
# CSS loads fine (no CORS restrictions) but JS modules fail silently → blank screen.
asar: false

directories:
  output: release

files:
  - dist/**/*
  - electron-dist/**/*.js
  - package.json

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fabegon ERP

publish:
  provider: github
  owner: Wasley06
  repo: Wasley06
